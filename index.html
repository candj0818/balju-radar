<html lang="ko">
<head>
<meta charset="utf-8">

<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>발주 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#141C27; --muted:#5A6677; --line:#D4DAE2; --line-2:#E6EAF0;
  --accent:#2346B5; --accent-ink:#FFFFFF; --accent-soft:#E2E8F9;
  --crit:#BF3526; --crit-soft:#FBE6E2; --warn:#9A6300; --warn-soft:#FAEFD6;
  --soon:#2346B5; --soon-soft:#E2E8F9; --ok:#2B7349; --ok-soft:#E0F1E6; --none:#5A6677; --none-soft:#E9ECF0;
  --fill:rgba(35,70,181,.10); --focus:rgba(35,70,181,.35);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#95A1B3; --line:#2A3445; --line-2:#222B39;
    --accent:#8BA4FF; --accent-ink:#0E131A; --accent-soft:#1E2A4E;
    --crit:#FF7E6E; --crit-soft:#3B1D19; --warn:#F0B44C; --warn-soft:#382B12;
    --soon:#8BA4FF; --soon-soft:#1E2A4E; --ok:#6FCB95; --ok-soft:#16301F; --none:#95A1B3; --none-soft:#222B39;
    --fill:rgba(139,164,255,.14); --focus:rgba(139,164,255,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#95A1B3; --line:#2A3445; --line-2:#222B39;
  --accent:#8BA4FF; --accent-ink:#0E131A; --accent-soft:#1E2A4E;
  --crit:#FF7E6E; --crit-soft:#3B1D19; --warn:#F0B44C; --warn-soft:#382B12;
  --soon:#8BA4FF; --soon-soft:#1E2A4E; --ok:#6FCB95; --ok-soft:#16301F; --none:#95A1B3; --none-soft:#222B39;
  --fill:rgba(139,164,255,.14); --focus:rgba(139,164,255,.45);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);position:relative;flex:none;
  background:conic-gradient(from 0deg,var(--fill),transparent 30%)}
.mark::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);left:19px;top:7px}
.brand h1{font-size:22px;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:not([aria-selected="true"]):hover{color:var(--ink);background:var(--surface-2)}

.note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
.note.err{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:8px;font-size:14px;z-index:10;max-width:calc(100% - 32px)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.section-head h2{font-size:17px;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;
  background:var(--none-soft);color:var(--none)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip[data-k="crit"]{background:var(--crit-soft);color:var(--crit)}
.chip[data-k="warn"]{background:var(--warn-soft);color:var(--warn)}
.chip[data-k="soon"]{background:var(--soon-soft);color:var(--soon)}
.chip[data-k="ok"]{background:var(--ok-soft);color:var(--ok)}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.counts .chip{font-size:13.5px;padding:5px 12px 5px 10px}
.counts b{font-family:var(--mono);font-weight:600}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tbl th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.link{cursor:pointer}
.tbl tbody tr.link:hover td{background:var(--surface-2)}
.tbl tfoot td{border-top:1px solid var(--line);font-weight:600}
.pname{font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.pname:hover{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.in.text{font-family:var(--sans);text-align:left}
.in:disabled{background:var(--surface-2);color:var(--muted);border-style:dashed}
.in:hover:not(:disabled){border-color:var(--muted)}
.tbl td .in{min-width:88px}
.search{max-width:260px}

/* factory order cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.fcard{display:flex;flex-direction:column}
.fcard-head{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.fcard-head .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fcard-head h3{font-size:16px;font-weight:700}
.fcard .when{font-size:21px;font-weight:700;line-height:1.25}
.fcard .when.crit{color:var(--crit)}
.fcard .tbl td,.fcard .tbl th{padding:7px 16px}
.fcard-foot{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);margin-top:auto}
.cont{padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.cont .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13.5px}
.cont .hint{font-size:12.5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.po{width:100%;min-height:120px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px}

/* detail */
.detail-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.detail-top select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-weight:600;max-width:100%}
.verdict{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px 28px;align-items:center}
.verdict .eyebrow{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verdict .when{font-size:30px;font-weight:700;line-height:1.2;margin-top:6px}
.verdict .when.crit{color:var(--crit)}
.verdict .what{margin-top:6px;font-size:15px}
.warnline{margin-top:10px;font-size:13.5px;color:var(--crit);font-weight:500}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.facts div{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--line);padding-left:10px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500}

.chartbox{padding:16px 16px 8px}
.chartbox svg{display:block;width:100%;height:auto;min-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);padding:0 20px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.sw.dash{border-top:2px dashed var(--warn)}
.sw.ord{width:0;height:12px;border-top:0;border-left:2px dotted var(--ink)}
.sw.dot{width:9px;height:9px;border:2px solid var(--ok);border-radius:50%;background:var(--surface)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.grid-tbl th,.grid-tbl td{padding:6px 5px;text-align:center}
.grid-tbl th:first-child,.grid-tbl td:first-child{text-align:left;padding-left:14px;font-weight:600}
.grid-tbl .in{min-width:64px;padding:5px 6px}
.grid-tbl td.tot{font-family:var(--mono);color:var(--muted);padding-right:14px;text-align:right}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 18px;padding:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px}
.form-foot{display:flex;justify-content:flex-end;padding:0 18px 18px}

textarea.paste{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-family:var(--mono);font-size:13px;resize:vertical}
.example{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;white-space:pre;overflow-x:auto;margin:0}

details.how{font-size:13.5px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:500;color:var(--ink)}
details.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ex{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

@media (max-width:760px){
  .verdict{grid-template-columns:1fr;padding:18px}
  .verdict .when{font-size:24px}
  .two{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .tabs{width:100%}
  .tabs button{flex:1 1 auto}
  .search{max-width:none;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>발주 레이더</h1>
        <p>월 판매량과 재고로 공장별 발주일과 수량을 계산합니다</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="dash" id="tab-dash">발주 현황</button>
      <button role="tab" data-view="close" id="tab-close">월 마감 입력</button>
      <button role="tab" data-view="import" id="tab-import">엑셀 붙여넣기</button>
      <button role="tab" data-view="detail" id="tab-detail">제품 상세</button>
      <button role="tab" data-view="fac" id="tab-fac">공장</button>
    </nav>
  </header>
  <div id="note" class="note" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const DAY=864e5,WD='일월화수목금토';
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const pad=n=>String(n).padStart(2,'0');
const mk=(y,m)=>y+'-'+pad(m+1);
function addM(k,n){let[y,m]=k.split('-').map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return mk(y,m)}
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const CUR=mk(T0.getFullYear(),T0.getMonth()),LAST=addM(CUR,-1);
const num=(v,d=0)=>{if(v===''||v==null)return d;const n=Number(v);return Number.isFinite(n)?n:d};
const fmtN=n=>Math.round(n).toLocaleString('ko-KR');
const dayDate=i=>new Date(T0.getTime()+i*DAY);
const fmtD=d=>`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mLabel=k=>{const[y,m]=k.split('-');return `${y}년 ${+m}월`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const normName=s=>String(s||'').replace(/\s+/g,'').toLowerCase();

const DEF_P={name:'새 제품',factoryId:'',stock:0,leadDays:'',serviceLevel:95,moq:10,orderStep:5,unit:1,boxL:'',boxW:'',boxH:'',boxKg:'',boxCbm:''};
const DEF_F={name:'새 공장',leadDays:60,cycleDays:30,containerCbm:64,containerKg:26000};
const boxCbm=p=>{const c=num(p.boxCbm,0);if(c>0)return c;const l=num(p.boxL,0),w=num(p.boxW,0),h=num(p.boxH,0);return l>0&&w>0&&h>0?l*w*h/1e6:0};
const boxesOf=(p,q)=>Math.ceil(q/Math.max(1,num(p.unit,1)));
const gcd=(a,b)=>b?gcd(b,a%b):a;
/* 주문 배수(기본 5)와 박스 입수를 모두 만족하는 최소 단위 */
const stepOf=p=>{const s=Math.max(1,Math.round(num(p.orderStep,5))),u=Math.max(1,Math.round(num(p.unit,1)));return s*u/gcd(s,u)};
const fmtC=v=>v.toLocaleString('ko-KR',{maximumFractionDigits:1,minimumFractionDigits:1});
const S={products:[],factories:[],view:'dash',sel:null,closeMonth:LAST,gridYear:T0.getFullYear(),ready:false,q:'',fac:'all',importText:'',preview:null,busy:false};
const byId=id=>S.products.find(p=>p.id===id);
const facById=id=>S.factories.find(f=>f.id===id);
const facOf=p=>facById(p.factoryId)||null;
const facName=p=>facOf(p)?.name||'공장 미지정';
const leadOf=p=>{const v=num(p.leadDays,0);if(v>0)return Math.round(v);return Math.max(1,Math.round(num(facOf(p)?.leadDays,60)))};
const cycleOf=p=>Math.max(1,Math.round(num(facOf(p)?.cycleDays,30)));
const incSum=p=>(p.incoming||[]).reduce((a,x)=>a+Math.max(0,num(x.qty)),0);

/* ---------- forecast ---------- */
const Z={90:1.28,95:1.65,98:2.05,99:2.33};
const median=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
const clipTo=(v,med)=>med>0?Math.min(med*2,Math.max(med/2,v)):v;
const sum=a=>a.reduce((x,y)=>x+y,0);
function model(p){
  const s=k=>{const v=p.sales&&p.sales[k];return (v===''||v==null||!Number.isFinite(Number(v)))?null:Number(v)};
  const ratios=Array.from({length:12},()=>[]);let years=0;
  for(let w=0;w<2;w++){
    const ks=[];for(let i=0;i<12;i++)ks.push(addM(LAST,-12*w-i));
    const vs=ks.map(s);if(vs.some(v=>v==null))continue;
    const med=median(vs),cv=vs.map(v=>clipTo(v,med)),m=sum(cv)/12;if(m<=0)continue;
    years++;ks.forEach((k,i)=>ratios[+k.slice(5)-1].push(cv[i]/m));
  }
  const shrink=years>=2?0.75:0.5;
  const idx=ratios.map(r=>r.length?1+(sum(r)/r.length-1)*shrink:1);
  const I=k=>idx[+k.slice(5)-1];
  const recent=[];
  for(let i=0;i<12&&recent.length<6;i++){const k=addM(LAST,-i),v=s(k);if(v!=null)recent.push(v/I(k))}
  const med=median(recent),cl=recent.map(v=>clipTo(v,med));
  const clippedN=cl.filter((v,i)=>Math.abs(v-recent[i])>1e-9).length;
  const w=[3,3,2,2,1,1];let ws=0,wt=0;cl.forEach((v,i)=>{ws+=v*w[i];wt+=w[i]});
  const level=wt?ws/wt:0;
  const des=[];for(let i=0;i<12;i++){const k=addM(LAST,-i),v=s(k);if(v!=null)des.push(v/I(k))}
  let sigma,sigmaEst=false;
  if(des.length>=3){const m=sum(des)/des.length;sigma=Math.sqrt(des.reduce((a,v)=>a+(v-m)**2,0)/(des.length-1))}
  else{sigma=level*0.3;sigmaEst=true}
  const cv=level>0?sigma/level:0;
  const vol=sigmaEst?{k:'none',t:'판단 보류'}:cv<0.15?{k:'ok',t:'안정'}:cv<0.35?{k:'soon',t:'보통'}:{k:'warn',t:'불안정'};
  const f=k=>level*I(k);
  const method=recent.length?[`최근 ${recent.length}개월 가중평균`,clippedN?`튄 달 ${clippedN}개 보정`:'',years?`계절성 ${years}년치 반영`:'계절성 미반영(12개월 필요)'].filter(Boolean).join(' · '):null;
  return {f,level,sigma,cv,vol,sigmaEst,years,method,hasData:recent.length>0};
}

/* ---------- 오늘 기준 예상 재고 ----------
   재고를 입력한 날(stockDate)부터 오늘까지 팔렸을 양을 예측치로 빼서 오늘 재고를 추정한다.
   입력일이 없던 예전 데이터는 빼지 않고 "입력일 모름"으로 표시한다. */
const STALE_DAYS=7;
function stockNow(p,M){
  const raw=num(p.stock,0),d=parseDate(p.stockDate);
  if(!d)return {raw,est:raw,age:null,sold:0,stale:true};
  const age=Math.max(0,Math.round((T0-d)/DAY));
  let sold=0;
  if(M.hasData)for(let i=0;i<age;i++){const x=new Date(d.getTime()+i*DAY);sold+=Math.max(0,M.f(mk(x.getFullYear(),x.getMonth())))/dim(x.getFullYear(),x.getMonth())}
  return {raw,est:Math.max(0,raw-sold),age,sold,stale:age>STALE_DAYS,date:d};
}
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
function stockNote(ST){
  if(ST.age==null)return '입력일 모름 — 재고를 다시 입력하세요';
  if(ST.age===0)return '오늘 입력';
  return `${fmtMD(ST.date)} 입력 ${fmtN(ST.raw)} − ${ST.age}일 판매 추정 ${fmtN(ST.sold)}`;
}

/* ---------- plan simulation ---------- */
function plan(p){
  const M=model(p);
  const lead=leadOf(p),cover=cycleOf(p);
  const sl=Z[num(p.serviceLevel,95)]?num(p.serviceLevel,95):95;
  const SS=Z[sl]*M.sigma*Math.sqrt(lead/30);
  const unit=stepOf(p),moq=Math.max(0,num(p.moq,0));
  const H=183,N=H+lead+cover+2;
  const dd=new Array(N),cache={};
  for(let i=0;i<N;i++){const d=dayDate(i);const k=mk(d.getFullYear(),d.getMonth());
    if(!(k in cache))cache[k]=Math.max(0,M.f(k))/dim(d.getFullYear(),d.getMonth());dd[i]=cache[k]}
  const pre=[0];for(let i=0;i<N;i++)pre.push(pre[i]+dd[i]);
  const dem=(i,n)=>pre[Math.min(N,i+n)]-pre[Math.min(N,i)];
  const ST=stockNow(p,M);
  let onHand=ST.est;const arr={},pendingDays=[];
  (p.incoming||[]).forEach(x=>{const q=num(x.qty);if(q<=0)return;const t=parseDate(x.date);let d=t?Math.round((t-T0)/DAY):lead;d=Math.max(0,d);arr[d]=(arr[d]||0)+q;pendingDays.push(d)});
  const orders=[],series=[],rops=[],ips=[];let stockout=null;
  for(let i=0;i<H;i++){
    if(arr[i])onHand+=arr[i];
    let pipe=0;for(const k in arr){if(+k>i)pipe+=arr[k]}
    const ip=onHand+pipe;ips.push(ip);
    const rop=dem(i,lead)+SS;rops.push(rop);
    if(dd[i]>0&&ip<=rop){
      let q=dem(i,lead+cover)+SS-ip;q=Math.ceil(Math.max(q,moq)/unit)*unit;
      if(q>0){orders.push({day:i,qty:q,arrive:i+lead});arr[i+lead]=(arr[i+lead]||0)+q}
    }
    series.push(onHand);
    onHand-=dd[i];
    if(onHand<-1e-9&&stockout==null)stockout=i;
  }
  const avgDaily=dem(0,30)/30,next=orders[0]||null;
  let status;
  if(!M.hasData)status={k:'none',t:'판매량 필요',rank:9e9};
  else if(!next)status={k:'ok',t:'6개월 내 없음',rank:1e9};
  else if(next.day<=0)status={k:'crit',t:'지금 발주',rank:0};
  else if(next.day<=7)status={k:'warn',t:`${next.day}일 내 발주`,rank:next.day};
  else if(next.day<=30)status={k:'soon',t:`${next.day}일 후 발주`,rank:next.day};
  else status={k:'ok',t:`${next.day}일 후 발주`,rank:next.day};
  const shortage=stockout!=null&&(!next||stockout<next.arrive)?stockout:null;
  const qtyAt=D=>{let q=dem(D,lead+cover)+SS-ips[D];if(q<=0)return 0;return Math.ceil(Math.max(q,moq)/unit)*unit};
  return {M,orders,series,rops,stockout:shortage,avgDaily,next,status,lead,cover,H,pendingDays,SS,sl,qtyAt,ST,dem,ips};
}
let PC=new Map();
const getPlan=p=>{let P=PC.get(p.id);if(!P){P=plan(p);PC.set(p.id,P)}return P};

/* 공장별 묶음 발주: 가장 급한 제품 날짜(D)에, 다음 주기 전에 발주가 필요한 제품을 함께 */
function batches(){
  const groups=new Map();
  S.factories.forEach(f=>groups.set(f.id,{f,items:[]}));
  S.products.forEach(p=>{const key=facById(p.factoryId)?p.factoryId:'';if(!groups.has(key))groups.set(key,{f:null,items:[]});groups.get(key).items.push(p)});
  const out=[];
  groups.forEach(({f,items})=>{
    if(!items.length)return;
    const cyc=f?Math.max(1,Math.round(num(f.cycleDays,30))):30;
    const withNext=items.map(p=>({p,P:getPlan(p)})).filter(x=>x.P.M.hasData&&x.P.next);
    let D=null;withNext.forEach(x=>{if(D==null||x.P.next.day<D)D=x.P.next.day});
    const lines=D==null?[]:withNext.filter(x=>x.P.next.day<D+cyc).map(x=>({p:x.p,P:x.P,qty:x.P.qtyAt(D)})).filter(x=>x.qty>0).sort((a,b)=>a.P.next.day-b.P.next.day);
    let status;
    if(D==null)status={k:'ok',t:'6개월 내 없음',rank:1e9};
    else if(D<=0)status={k:'crit',t:'지금 발주',rank:0};
    else if(D<=7)status={k:'warn',t:`${D}일 내 발주`,rank:D};
    else if(D<=30)status={k:'soon',t:`${D}일 후 발주`,rank:D};
    else status={k:'ok',t:`${D}일 후 발주`,rank:D};
    const b={f,key:f?f.id:'',name:f?f.name:'공장 미지정',D,lines,status,cyc,count:items.length,
      lead:f?Math.max(1,Math.round(num(f.leadDays,60))):60};
    if(lines.length)container(b,items.map(p=>({p,P:getPlan(p)})));
    out.push(b);
  });
  return out.sort((a,b)=>a.status.rank-b.status.rank);
}
/* 컨테이너 맞추기: 남는 공간은 판매 속도에 비례해 같은 일수만큼 채우고(최대 90일치),
   마지막 컨테이너가 30% 미만이면 급하지 않은 품목을 다음 발주로 미뤄 한 대를 줄인다 */
function container(b,all){
  const cap={cbm:Math.max(1,num(b.f?.containerCbm,64)),kg:Math.max(1,num(b.f?.containerKg,26000))};
  const loadOf=m=>{let c=0,k=0;m.forEach((q,id)=>{const p=byId(id);if(!p||q<=0)return;const bx=boxesOf(p,q);c+=bx*boxCbm(p);k+=bx*num(p.boxKg,0)});return {c,k,r:Math.max(c/cap.cbm,k/cap.kg)}};
  const mapOf=lines=>new Map(lines.map(l=>[l.p.id,l.qty]));
  const missing=b.lines.filter(l=>!boxCbm(l.p)).map(l=>l.p);
  let L=loadOf(mapOf(b.lines));
  if(L.c<=0){b.box={none:true,missing,cap};return}
  let n=Math.max(1,Math.ceil(L.r-1e-9)),mode=null,extraDays=0,deferred=[];
  const frac=L.r-Math.floor(L.r);
  if(L.r>1&&frac>1e-9&&frac<0.3){
    const tgt=Math.floor(L.r);
    const opt=b.lines.filter(l=>l.P.next.day>Math.max(0,b.D)).sort((a,c)=>c.P.next.day-a.P.next.day);
    const kept=[...b.lines],out=[];
    for(const l of opt){if(loadOf(mapOf(kept)).r<=tgt+1e-9)break;kept.splice(kept.indexOf(l),1);out.push(l)}
    if(loadOf(mapOf(kept)).r<=tgt+1e-9){b.lines=kept;n=tgt;mode='trim';deferred=out}
  }
  if(mode!=='trim'){
    /* 고르게 채우기: 입고 시점 재고일수가 가장 낮은 제품부터 끌어올려(물 채우기),
       공장의 모든 제품이 입고 후 최소 T일치를 갖도록 한다. T는 컨테이너가 허용하는 최대치(상한 120일) */
    const D=Math.max(0,b.D);
    const base=mapOf(b.lines);
    const info=all.filter(x=>x.P.M.hasData&&x.P.avgDaily>0&&boxCbm(x.p)>0).map(x=>{const P=x.P;
      const rate=P.dem(D+P.lead,60)/60||P.avgDaily;
      const pos=P.ips[Math.min(D,P.ips.length-1)]-P.dem(D,P.lead)+(base.get(x.p.id)||0);
      return {x,rate,pos}});
    const adds=T=>info.map(({x,rate,pos})=>{let a=T*rate-pos;if(a<=0)return {x,add:0};
      if(!base.has(x.p.id))a=Math.max(a,num(x.p.moq,0));const u=stepOf(x.p);return {x,add:Math.ceil(a/u)*u}});
    const withT=T=>{const m=new Map(base);adds(T).forEach(({x,add})=>m.set(x.p.id,(m.get(x.p.id)||0)+add));return loadOf(m).r};
    const MAXT=120;
    let T=0;
    if(withT(0)<=n+1e-9){let lo=0,hi=MAXT;if(withT(hi)<=n)lo=hi;else for(let i=0;i<25;i++){const mid=(lo+hi)/2;if(withT(mid)<=n)lo=mid;else hi=mid}T=Math.floor(lo)}
    const got=adds(T).filter(a=>a.add>0);
    if(got.length){
      got.forEach(({x,add})=>{const l=b.lines.find(l=>l.p.id===x.p.id);
        if(l){l.qty+=add;l.extra=add}else b.lines.push({p:x.p,P:x.P,qty:add,extra:add,topup:true})});
      mode='fill';extraDays=T;
    }
    b.fillInfo={T,count:got.length,total:info.length};
  }
  b.box={n,load:loadOf(mapOf(b.lines)),cap,mode,extraDays,deferred,missing,capped:mode==='fill'&&extraDays>=120,fillInfo:b.fillInfo};
}

/* ---------- chart ---------- */
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function chart(P){
  const W=760,Hh=270,L=56,R=18,Tp=24,B=32,n=P.series.length;
  let max=Math.max(1,...P.series,...P.rops)*1.12,min=Math.min(0,...P.series);
  if(min<0)min*=1.15;
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>Tp+(Hh-Tp-B)*(1-(v-min)/(max-min));
  const step=niceStep((max-min)/4);
  let g='';
  for(let v=Math.ceil(min/step)*step;v<=max;v+=step){
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmtN(v)}</text>`}
  for(let i=0;i<n;i++){const d=dayDate(i);if(d.getDate()===1){
    g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${Tp}" y2="${Hh-B}" stroke="var(--line-2)"/>`+
       `<text x="${x(i)+4}" y="${Hh-B+18}" font-size="11.5" fill="var(--muted)">${d.getMonth()+1}월</text>`}}
  if(min<0)g+=`<rect x="${L}" y="${y(0)}" width="${W-L-R}" height="${Hh-B-y(0)}" fill="var(--crit-soft)"/>`+
    `<text x="${W-R-6}" y="${Hh-B-6}" text-anchor="end" font-size="11" fill="var(--crit)">재고 부족 구간</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  const pts=P.series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  g+=`<path d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(n-1)},${y(0)} Z" fill="var(--fill)"/>`;
  g+=`<path d="M${P.rops.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L')}" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g+=`<path d="M${pts.join(' L')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const dot=i=>`<circle cx="${x(i)}" cy="${y(P.series[i])}" r="4.5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2.2"/>`;
  let lastLab=-999;
  P.orders.forEach(o=>{
    const X=x(o.day);
    g+=`<line x1="${X}" x2="${X}" y1="${Tp-6}" y2="${Hh-B}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    if(X-lastLab>74){g+=`<text x="${Math.min(X+5,W-R-70)}" y="${Tp+6}" font-size="11.5" font-weight="600" fill="var(--ink)">발주 ${fmtN(o.qty)}</text>`;lastLab=X}
    if(o.arrive<n)g+=dot(o.arrive);
  });
  P.pendingDays.forEach(i=>{if(i<n)g+=dot(i)});
  g+=`<circle cx="${x(0)}" cy="${y(P.series[0])}" r="4" fill="var(--accent)"/>`+
     `<text x="${x(0)+8}" y="${y(P.series[0])-8}" font-size="11.5" fill="var(--accent)" font-weight="600">오늘</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="향후 6개월 예상 재고 추이">${g}</svg>`;
}

function poText(b){
  const B=b.box;
  const head=`[${b.name}] 발주서 — ${iso(T0)}`+(B&&!B.none?` · 40HC ${B.n}대 (${fmtC(B.load.c)} CBM)`:'');
  return head+'\n제품명\t수량\t박스\tCBM\n'+b.lines.map(l=>{const bx=boxesOf(l.p,l.qty),c=bx*boxCbm(l.p);return `${l.p.name}\t${l.qty}\t${bx}\t${c?fmtC(c):''}`}).join('\n')+
    `\n합계\t${b.lines.reduce((a,l)=>a+l.qty,0)}\t${b.lines.reduce((a,l)=>a+boxesOf(l.p,l.qty),0)}\t${B&&!B.none?fmtC(B.load.c):''}`;
}
function boxHTML(b){
  const B=b.box;if(!B)return '';
  if(B.none)return `<div class="cont"><p class="hint">박스 크기가 입력된 제품이 없어 컨테이너 적재량을 계산하지 못했습니다. 제품 상세에서 박스 가로·세로·높이를 넣어 주세요.</p></div>`;
  const pct=Math.round(B.load.r/B.n*100);
  const kg=B.load.k>0?` · ${fmtN(B.load.k)} / ${fmtN(B.cap.kg*B.n)} kg`:'';
  const msgs=[];
  if(B.mode==='fill'){const F=B.fillInfo||{};msgs.push(`빈 공간을 이 공장 제품 ${F.count}개에 고르게 나눴습니다. 재고가 적은 제품부터 채워, 입고 시점에 모든 제품이 최소 ${B.extraDays}일치 재고를 갖도록 했습니다.`+(B.capped?' 120일치까지 채워도 다 차지 않습니다. 소량 화물(LCL)로 보내는 방법을 검토하세요.':''))}
  if(B.mode==='trim')msgs.push(`마지막 컨테이너가 30%도 안 차서, 급하지 않은 ${B.deferred.length}개 품목(${B.deferred.slice(0,3).map(l=>esc(l.p.name)).join(', ')}${B.deferred.length>3?' 등':''})을 다음 발주로 미뤘습니다.`);
  if(B.missing.length)msgs.push(`<span style="color:var(--warn)">박스 크기가 없는 ${B.missing.length}개 품목은 적재량 계산에서 빠졌습니다.</span>`);
  return `<div class="cont">
    <div class="t"><b>40HC ${B.n}대</b><span class="num">${fmtC(B.load.c)} / ${fmtN(B.cap.cbm*B.n)} CBM${kg} · 적재율 ${pct}%</span></div>
    <div class="bar" role="img" aria-label="적재율 ${pct}%"><i style="width:${Math.min(100,pct)}%"></i></div>
    ${msgs.map(m=>`<p class="hint">${m}</p>`).join('')}
  </div>`;
}

function prodRows(){

      <li><b>안전재고</b> = 확률 계수(95%면 1.65) × 월 판매량 표준편차 × √(리드타임÷30). 리드타임이 60일이면 30일일 때보다 약 1.4배가 됩니다.</li>
      <li><b>제품 기준 발주일</b> — 재고 + 입고 대기가 “리드타임 동안 팔릴 양 + 안전재고” 아래로 내려오는 날.</li>

      <li><b>컨테이너 맞추기</b> — 수량을 박스로 바꿔 CBM(가로×세로×높이÷1,000,000)을 더하고 40HC 대수를 정합니다. 빈 공간은 입고 시점 재고일수가 가장 낮은 제품부터 채워 공장 전체 제품이 고르게 같은 일수만큼 버티도록 나누고(최대 120일치), 마지막 컨테이너가 30%도 안 차면 급하지 않은 품목을 다음 발주로 미뤄 한 대를 줄입니다. 박스 중량을 넣으면 무게 한도도 봅니다.</li>

    </ul></details>
  </section>`;
}

/* ---------- import ---------- */
function monthFromHeader(h){
  h=String(h).trim();let m;
  if((m=/^(\d{4})-(\d{1,2})-\d{1,2}$/.exec(h)))return +m[2]>=1&&+m[2]<=12?mk(+m[1],+m[2]-1):null;
  if((m=/^(20\d{2})(\d{2})$/.exec(h)))return +m[2]>=1&&+m[2]<=12?mk(+m[1],+m[2]-1):null;
  if((m=/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*월?$/.exec(h)))return +m[2]>=1&&+m[2]<=12?mk(+m[1],+m[2]-1):null;
  if((m=/^(\d{2})\s*[-./년]\s*(\d{1,2})\s*월?$/.exec(h)))return +m[2]>=1&&+m[2]<=12?mk(2000+ +m[1],+m[2]-1):null;
  if((m=/^(\d{1,2})\s*월$/.exec(h))){const t=+m[1];for(let i=0;i<12;i++){const k=addM(LAST,-i);if(+k.slice(5)===t)return k}}
  return null;
}
const cellNum=v=>{const s=String(v??'').replace(/[,\s원개]/g,'');if(s==='')return null;const n=Number(s);return Number.isFinite(n)?n:null};
function parseImport(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2)return {error:'머리글 줄과 제품 줄이 최소 한 줄씩 있어야 합니다.'};
  const sep=lines[0].includes('\t')?'\t':',';
  const head=lines[0].split(sep).map(s=>s.trim());
  const col={name:-1,fac:-1,stock:-1,lead:-1,months:[],ext:{}};
  const EXT=[['boxCbm',/cbm/i],['unit',/입수/],['orderStep',/배수|주문 *단위/],['boxL',/가로|길이/],['boxW',/세로|폭/],['boxH',/높이/],['boxKg',/중량|무게|kg/i],['moq',/moq|최소/i]];
  head.forEach((h,i)=>{
    const mm=monthFromHeader(h);
    if(mm){col.months.push({i,k:mm});return}
    const ex=EXT.find(([k,re])=>col.ext[k]==null&&re.test(h));
    if(ex){col.ext[ex[0]]=i;return}
    if(col.name<0&&/제품|품목|상품|품명|name/i.test(h))col.name=i;
    else if(col.fac<0&&/공장|거래처|업체|factory/i.test(h))col.fac=i;
    else if(col.stock<0&&/재고|stock/i.test(h))col.stock=i;
    else if(col.lead<0&&/리드/i.test(h))col.lead=i;
  });
  if(col.name<0)return {error:'머리글에서 “제품명” 열을 찾지 못했습니다. 첫 줄에 제품명, 공장, 재고, 2026-08 같은 머리글을 넣어 주세요.'};
  const future=col.months.filter(c=>c.k>LAST);
  const rows=[];
  lines.slice(1).forEach(l=>{
    const c=l.split(sep);const name=(c[col.name]||'').trim();if(!name)return;
    const r={name,fac:col.fac>=0?(c[col.fac]||'').trim():'',stock:col.stock>=0?cellNum(c[col.stock]):null,lead:col.lead>=0?cellNum(c[col.lead]):null,sales:{},ext:{}};
    Object.entries(col.ext).forEach(([k,i])=>{const v=cellNum(c[i]);if(v!=null&&v>=0)r.ext[k]=v});
    col.months.forEach(({i,k})=>{if(k>LAST)return;const v=cellNum(c[i]);if(v!=null)r.sales[k]=Math.max(0,v)});
    rows.push(r);
  });
  const known=new Map(S.products.map(p=>[normName(p.name),p]));
  const facKnown=new Set(S.factories.map(f=>normName(f.name)));
  const newFac=[...new Set(rows.map(r=>r.fac).filter(f=>f&&!facKnown.has(normName(f))))];
  const hasBox=r=>{const e=r.ext;if(e.boxCbm>0||(e.boxL>0&&e.boxW>0&&e.boxH>0))return true;const p=known.get(normName(r.name));return !!(p&&boxCbm({...p,...e}))};
  const noBox=rows.filter(r=>!hasBox(r)).map(r=>r.name);
  return {noBox,rows,col,head,future,newCount:rows.filter(r=>!known.has(normName(r.name))).length,
    updCount:rows.filter(r=>known.has(normName(r.name))).length,newFac,months:col.months.filter(c=>c.k<=LAST).map(c=>c.k)};
}

async function applyImport(){
  const pv=S.preview;if(!pv||pv.error||S.busy)return;
  S.busy=true;render();
  const writes=[];let t=Date.now();
  const facMap=new Map(S.factories.map(f=>[normName(f.name),f]));
  pv.newFac.forEach(name=>{const f={id:newId('factories'),...DEF_F,name,createdAt:t++};S.factories.push(f);facMap.set(normName(name),f);writes.push(['factories',f])});
  const known=new Map(S.products.map(p=>[normName(p.name),p]));
  pv.rows.forEach(r=>{
    let p=known.get(normName(r.name));
    if(!p){p={id:newId('products'),...DEF_P,name:r.name,sales:{},incoming:[],createdAt:t++};S.products.push(p);known.set(normName(r.name),p)}
    if(r.fac){const f=facMap.get(normName(r.fac));if(f)p.factoryId=f.id}
    if(r.stock!=null){p.stock=r.stock;p.stockDate=iso(T0)}
    if(r.lead!=null&&r.lead>0)p.leadDays=r.lead;
    Object.entries(r.ext).forEach(([k,v])=>{if((k==='unit'||k==='orderStep')&&v<1)return;p[k]=v});
    p.sales={...(p.sales||{}),...r.sales};
    if(!writes.some(w=>w[1]===p))writes.push(['products',p]);
  });
  await runWrites(writes,(i,n)=>{const el=document.getElementById('impStatus');if(el)el.textContent=`저장 중 ${i}/${n}`});
  S.busy=false;S.preview=null;S.importText='';S.view='dash';render();
  toast(`${pv.rows.length}개 제품을 저장했습니다`);
}

function tplMonths(){let s=mk(T0.getFullYear(),0);if(s>LAST)s=addM(LAST,-11);const out=[];for(let k=s;k<=LAST;k=addM(k,1))out.push(k);return out}
function tplLabel(){const ms=tplMonths(),a=ms[0],b=ms[ms.length-1];return a.slice(0,4)===b.slice(0,4)?`${a.slice(2,4)}년 ${+a.slice(5)}~${+b.slice(5)}월`:`${mLabel(a)}~${mLabel(b)}`}
async function readFile(file){
  if(!window.XLSX){toast('파일 읽기 도구를 불러오지 못했습니다. 표를 복사해 붙여넣어 주세요.');return}
  try{
    const buf=await file.arrayBuffer();let wb;
    if(/\.csv$/i.test(file.name)){
      let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('euc-kr').decode(buf)}
      wb=XLSX.read(text.replace(/^﻿/,''),{type:'string'});
    }else wb=XLSX.read(buf,{type:'array',cellDates:true});
    const cell=v=>{
      if(v instanceof Date){const d=new Date(v.getTime()+12*3600e3);return mk(d.getFullYear(),d.getMonth())}
      return String(v??'').replace(/[\t\r\n]+/g,' ').trim();
    };
    let best=null;
    for(const name of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
      if(!rows.length)continue;
      const tsv=rows.map(r=>r.map(cell).join('\t')).join('\n');
      const pv=parseImport(tsv);
      if(!pv.error){best={tsv,pv};break}
      if(!best)best={tsv,pv};
    }
    if(!best){toast('파일에 읽을 내용이 없습니다.');return}
    S.importText=best.tsv;S.preview=best.pv;render();
    toast(best.pv.error?'파일을 읽었지만 머리글을 확인해 주세요':`${file.name}을 읽었습니다. 미리보기를 확인하고 저장하세요`);
  }catch(e){toast('파일을 읽지 못했습니다. .xlsx 또는 .csv 파일인지 확인하세요.')}
}
async function downloadTemplate(){
  if(!window.XLSX||!(S.dl||GH.on))return;
  const ms=tplMonths();
  const aoa=[['제품명','공장','재고(오늘)','MOQ','주문 배수','박스 입수','가로(cm)','세로(cm)','높이(cm)','박스 CBM','박스중량(kg)',...ms]];
  const list=S.products.filter(p=>!isEx(p));
  list.forEach(p=>aoa.push([p.name,facOf(p)?.name||'','',num(p.moq,0),num(p.orderStep,5),num(p.unit,1),p.boxL??'',p.boxW??'',p.boxH??'',p.boxCbm??'',p.boxKg??'',...ms.map(k=>p.sales?.[k]??'')]));
  if(!list.length)aoa.push(['제품명을 적으세요','공장명',0,10,5,1,'','','','','',...ms.map(()=>'')]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:24},{wch:12},{wch:8},{wch:7},{wch:9},{wch:9},{wch:9},{wch:9},{wch:9},{wch:9},{wch:11},...ms.map(()=>({wch:9}))];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'판매량');
  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const filename=`발주레이더_판매량_${ms[0]}~${ms[ms.length-1]}.xlsx`;
  if(!S.dl){const url=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);toast('양식을 내려받았습니다');return}
  try{await S.dl.save({filename,data:new Blob([out])});toast('양식을 저장했습니다')}
  catch(e){if(e&&e.code!=='declined')toast('양식을 저장하지 못했습니다.')}
}

/* ---------- GitHub 저장소: 로그인 없이 쓰는 주소(GitHub Pages)용 ----------
   데이터는 비공개 저장소 balju-radar-data의 data.json 한 파일. 접속 키는 기기에만 저장.
   저장 = 최신본을 받아 내 변경(dirty)만 덮어 합친 뒤 sha를 걸어 올림. 충돌(409/422)이면 다시 받아 합침. */
const GH={on:false,owner:'candj0818',repo:'balju-radar-data',path:'data.json',token:'',dirty:new Set(),ver:{},tomb:{},tombDirty:false,busy:false,again:false,timer:null,last:null,err:null};
const TOKEN_KEY='balju-radar-gh-token';
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ghHeaders=json=>{const h={Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(json)h['Content-Type']='application/json';return h};
const ghURL=()=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
async function ghGet(){
  const r=await fetch(ghURL(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return {data:{},sha:null};
  if(!r.ok)throw {status:r.status};
  const j=await r.json();
  let text=j.content?b64dec(j.content):'';
  if(!text&&j.size>0){const r2=await fetch(ghURL(),{headers:{...ghHeaders(),Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r2.ok)throw {status:r2.status};text=await r2.text()}
  return {data:text?JSON.parse(text):{},sha:j.sha};
}
function ghMerge(d){
  Object.entries(d.deleted||{}).forEach(([id,t])=>{if(!GH.tomb[id]||GH.tomb[id]<t)GH.tomb[id]=t});
  ['products','factories'].forEach(kind=>{
    const cur=kind==='products'?S.products:S.factories;
    const out=(d[kind]||[]).filter(x=>x&&x.id&&!GH.tomb[x.id]).map(x=>{
      if(GH.dirty.has(x.id)){const l=cur.find(c=>c.id===x.id);if(l)return l}
      const o=JSON.parse(JSON.stringify(x));return kind==='products'?normP(o):o});
    cur.forEach(o=>{if(GH.dirty.has(o.id)&&!GH.tomb[o.id]&&!out.some(q=>q.id===o.id))out.push(o)});
    out.sort((a,b)=>num(a.createdAt)-num(b.createdAt));
    if(kind==='products')S.products=out;else S.factories=out;
  });
}
function ghSchedule(ms=1500){clearTimeout(GH.timer);GH.timer=setTimeout(ghSync,ms);ghStatus()}
async function ghSync(){
  if(!GH.on||!GH.token)return;
  if(GH.busy){GH.again=true;return}
  GH.busy=true;GH.again=false;ghStatus();
  try{
    for(let attempt=0;;attempt++){
      const {data,sha}=await ghGet();
      ghMerge(data);
      if(!GH.dirty.size&&!GH.tombDirty)break;
      const snap=new Map([...GH.dirty].map(id=>[id,GH.ver[id]])),tombSnap=GH.tombDirty,now=Date.now();
      Object.keys(GH.tomb).forEach(id=>{if(now-GH.tomb[id]>180*DAY)delete GH.tomb[id]});
      const doc={version:1,savedAt:new Date().toISOString(),
        factories:S.factories.map(f=>({id:f.id,...bodyOf('factories',f)})),
        products:S.products.map(p=>({id:p.id,...bodyOf('products',p)})),deleted:GH.tomb};
      const r=await fetch(ghURL(),{method:'PUT',headers:ghHeaders(true),
        body:JSON.stringify({message:`발주 레이더 저장 · ${snap.size||1}건`,content:b64enc(JSON.stringify(doc)),...(sha?{sha}:{})})});
      if(r.ok){snap.forEach((v,id)=>{if(GH.ver[id]===v)GH.dirty.delete(id)});if(tombSnap)GH.tombDirty=false;break}
      if((r.status===409||r.status===422)&&attempt<5){await new Promise(z=>setTimeout(z,300+Math.random()*700));continue}
      throw {status:r.status};
    }
    GH.last=new Date();GH.err=null;
  }catch(e){GH.err=(e&&e.status)||'net'}
  finally{
    GH.busy=false;saveLocal();ghStatus();
    if(!S.ready){S.ready=true;render()}else onData();
    if(GH.again||(GH.dirty.size&&!GH.err))ghSchedule(GH.again?300:3000);
  }
}
function ghStatus(){
  if(!GH.on)return;
  if(!GH.token){note('');return}
  const e=GH.err;
  if(e===401)note('접속 키가 맞지 않거나 만료되었습니다. 공장 탭 맨 아래 ‘이 기기 연결 해제’ 후 새 키를 넣으세요.',true);
  else if(e===403||e===404)note(`이 접속 키로는 데이터 저장소(${GH.repo})에 쓸 수 없습니다. 키의 저장소 선택과 Contents 읽기·쓰기 권한을 확인하세요.`,true);
  else if(e)note('GitHub에 저장하지 못했습니다. 인터넷 연결을 확인하세요. 변경 내용은 이 기기에 보관 중이며 연결되면 자동으로 저장합니다.',true);
  else if(GH.busy||GH.dirty.size||GH.tombDirty)note('저장 중…');
  else note(GH.last?`GitHub에 저장됨 · ${pad(GH.last.getHours())}:${pad(GH.last.getMinutes())} 확인`:'GitHub에서 불러오는 중…');
}

    if(!r.ok){msg.textContent=`이 키로는 ${GH.repo} 저장소에 접근할 수 없습니다. 저장소 선택을 확인하세요.`;return}
  }catch(e){msg.textContent='인터넷 연결을 확인하세요.';return}

function ghDisconnect(){

function queueSave(kind,o){
  if(GH.on){o.updatedAt=Date.now();GH.dirty.add(o.id);GH.ver[o.id]=(GH.ver[o.id]||0)+1;saveLocal();ghSchedule();return}
  const key=kind+':'+o.id;dirty.add(o.id);clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(kind,o.id),600)}
function flush(kind,id){
  const key=kind+':'+id;timers[key]=null;
  if(!cols[kind]){saveLocal();dirty.delete(id);return}
  const o=kind==='factories'?facById(id):byId(id);if(!o){dirty.delete(id);return}
  const b=bodyOf(kind,o);
  chains[key]=(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(id).set(b)).catch(saveErr).finally(()=>{if(!timers[key])dirty.delete(id)});
}
function removeDoc(kind,id){
  if(GH.on){GH.tomb[id]=Date.now();GH.tombDirty=true;GH.dirty.delete(id);saveLocal();ghSchedule();return}
  const key=kind+':'+id;clearTimeout(timers[key]);timers[key]=null;
  if(!cols[kind]){saveLocal();return}
  dirty.add(id);(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(id).delete()).catch(saveErr).finally(()=>dirty.delete(id));
}
async function runWrites(list,progress){
  if(GH.on){list.forEach(([,o])=>{o.updatedAt=Date.now();GH.dirty.add(o.id);GH.ver[o.id]=(GH.ver[o.id]||0)+1});saveLocal();
    progress&&progress(0,list.length);clearTimeout(GH.timer);await ghSync();if(GH.busy)await new Promise(r=>{const w=()=>GH.busy?setTimeout(w,200):r();w()});return}
  if(!cols.products){saveLocal();return}
  list.forEach(([,o])=>dirty.add(o.id));
  let i=0,done=0;
  const worker=async()=>{while(i<list.length){const [kind,o]=list[i++];
    try{await cols[kind].doc(o.id).set(bodyOf(kind,o))}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*400));try{await cols[kind].doc(o.id).set(bodyOf(kind,o))}catch(e2){saveErr(e2)}}else saveErr(e)}
    done++;progress&&progress(done,list.length)}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  list.forEach(([,o])=>dirty.delete(o.id));
}
function saveErr(e){
  if(e&&e.code==='invalid_argument')note('이 페이지를 편집할 권한이 없어 변경 내용이 저장되지 않았습니다.',true);
  else if(e&&e.code==='quota_exceeded')note('저장 공간이 가득 찼습니다. 쓰지 않는 제품을 삭제한 뒤 다시 입력하세요.',true);
  else if(e&&e.code==='resource_exhausted')note('한꺼번에 너무 많이 저장하고 있습니다. 잠시 뒤 다시 시도하세요.',true);
  else note('저장하지 못했습니다. 연결을 확인한 뒤 다시 입력하세요.',true);
}

app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;if(S.view==='dash')soft();else{clearTimeout(softT);softT=setTimeout(()=>{render();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},300)}return}
  if(t.id==='importText'){S.importText=t.value;return}
  if(t.dataset.fid){const f=facById(t.dataset.fid);if(!f)return;const k=t.dataset.ff;f[k]=t.type==='number'?num(t.value,DEF_F[k]):t.value;queueSave('factories',f);return}
  const p=t.dataset&&t.dataset.pid?byId(t.dataset.pid):null;if(!p)return;
  if(t.dataset.inc!=null){const x=p.incoming[+t.dataset.inc];if(!x)return;x[t.dataset.incf]=t.dataset.incf==='qty'?num(t.value):t.value;p.incoming=p.incoming.map(y=>({...y}))}
  else if(t.dataset.m){p.sales={...(p.sales||{})};if(t.value==='')delete p.sales[t.dataset.m];else p.sales[t.dataset.m]=Math.max(0,num(t.value))}
  else if(t.dataset.f==='stock'){if(t.value==='')return;p.stock=Math.max(0,num(t.value));p.stockDate=iso(T0)}
  else if(t.dataset.f){const f=t.dataset.f;p[f]=t.matches('select')?(f==='serviceLevel'?num(t.value,95):t.value):t.type==='number'?(t.value===''?'':num(t.value)):t.value}
  queueSave('products',p);soft();
});

/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(d=>{S.dl=d;S.canDl=!!d;if(S.view==='import')render()}).catch(()=>{});
    try{db=await window.claude.use('db')}catch(e){}
  }
  if(db){
    cols.products=db.collection('products');cols.factories=db.collection('factories');
    let got={products:false,factories:false};
    const sub=(kind,norm)=>cols[kind].onSnapshot(snap=>{
      const cur=kind==='products'?S.products:S.factories;
      const list=snap.docs.map(d=>{if(dirty.has(d.id)){const l=cur.find(x=>x.id===d.id);if(l)return l}return norm({id:d.id,...JSON.parse(JSON.stringify(d.data()||{}))})});
      cur.forEach(o=>{if(dirty.has(o.id)&&!list.some(q=>q.id===o.id))list.push(o)});
      list.sort((a,b)=>num(a.createdAt)-num(b.createdAt));
      if(kind==='products')S.products=list;else S.factories=list;
      got[kind]=true;
      if(!S.ready&&got.products&&got.factories){S.ready=true;render()}else onData();
    },()=>note('저장소 연결이 끊겼습니다. 페이지를 새로고침하세요.',true));
    sub('products',normP);sub('factories',f=>f);
  }else{
    let cached=null;
    try{const raw=localStorage.getItem(LS);if(raw){cached=JSON.parse(raw);S.products=(cached.products||[]).map(normP);S.factories=cached.factories||[]}}catch(e){}
    if(window.claude){ // claude.ai 안인데 저장소를 못 쓰는 경우
      note('공유 저장소에 연결하지 못해 이 브라우저에만 저장됩니다.');
      S.ready=true;render();return;
    }
    // GitHub Pages 등 claude.ai 밖: GitHub 저장소 사용
    GH.on=true;S.canDl=true;
    if(cached&&cached.gh){(cached.gh.dirty||[]).forEach(id=>{GH.dirty.add(id);GH.ver[id]=1});GH.tomb=cached.gh.tomb||{};GH.tombDirty=!!cached.gh.tombDirty}
    try{GH.token=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
    S.ready=!!cached||!GH.token;render();
    if(GH.token)ghSync();
    setInterval(()=>{if(document.visibilityState==='visible'&&GH.token&&!GH.busy)ghSync()},45000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&GH.token&&!GH.busy)ghSync()});
    window.addEventListener('beforeunload',e=>{if(GH.dirty.size||GH.tombDirty||GH.busy){e.preventDefault();e.returnValue=''}});
  }
})();
})();
</script>

</html>
